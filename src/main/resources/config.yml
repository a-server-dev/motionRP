controller:
  name: モーションセット
  # item-model: motionrp:controller

# URL方式の仮スキン: MHF_Golem。標準は添付PNGを埋め込んだ巨人体です。
titan:
  # 添付PNGを埋め込んだ巨人体。falseなら従来のskin-url方式。
  use-bundled-skin: true
  skin-url: https://textures.minecraft.net/texture/1c6cd7202c34e78f3073090349f7d973b288af5e5b7334dd249010b3f27078f9

# 追加ポート不要。生成パックをGitHub Releasesへ公開します。
# 適用は各プレイヤーが /motionrp reload を実行したときのみ。設定再読込は /motionrp configreload。
resource-pack:
  enabled: false
  repository: a-server-dev/motionRP
  source-file: plugins/BetterModel/build.zip
  required: false
  prompt: MotionRPのモーション表示用リソースパックです。
# 認証: 環境変数 MOTIONRP_GITHUB_TOKEN または plugins/MotionRP/github-token.txt
# 公開するファイル名は mortionRP.zip。認証情報をこの設定へ書かないでください。

# Original MotionRP scenes: viewers opt in with /motionrp view; default OFF.
visibility:
  range: 48
