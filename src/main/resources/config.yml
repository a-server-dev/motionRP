# 操作の調査用。通常は false のまま使用します。
debug-input: false

# BetterModel/players にあるプレイヤーモデルを指定します。
# 標準の steve.bbmodel に含まれる roll を初期モーションとして使用します。
motions:
  senbonzakura:
    name: 千本桜景厳
    model: motionrp_senbonzakura
    animation: senbonzakura
    effect: senbonzakura
    max-ticks: 180
  gate_of_babylon:
    name: 王の財宝
    model: motionrp_gate_of_babylon
    animation: gate_of_babylon
    effect: gate_of_babylon
    max-ticks: 200
  susanoo:
    name: 須佐能乎（上半身）
    model: motionrp_susanoo
    animation: susanoo
    effect: susanoo
    max-ticks: 180
  rasenshuriken:
    name: 螺旋手裏剣（影分身二人）
    model: motionrp_rasenshuriken
    animation: rasenshuriken
    effect: rasenshuriken
    max-ticks: 200
  rasengan:
    name: 螺旋丸（影分身）
    model: motionrp_rasengan
    animation: rasengan
    effect: rasengan
    max-ticks: 140
  roll:
    name: 前転
    model: steve
    animation: roll
    # ループ設定に関係なく1回だけ再生します。安全のための終了上限（tick）。
    max-ticks: 100
    # 任意。配布するリソースパック側に対応するアイテムモデルが必要です。
    # item-model: motionrp:roll

controller:
  name: モーションセット
  # item-model: motionrp:controller
