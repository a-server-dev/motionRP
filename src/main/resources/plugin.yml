name: MotionRP
version: '${version}'
main: dev.aserver.motionrp.MotionPlugin
api-version: '26.3'
description: Player motion items, persistent loadouts and BetterModel integration
depend: [BetterModel]
commands:
  motionrp:
    description: モーションの登録・管理
    aliases: [mrp]
    usage: /motionrp [gui|view|fusion|broly|give|reload|status|pack]
  goalperformance:
    description: ゴールパフォーマンスを直接再生
    usage: /goalperformance [ronaldo|mbappe|kneeslide|kazu|stop]
  hrperformance:
    description: ホームランパフォーマンスを直接再生
    usage: /hrperformance [yamakawa|matsuda|destasha|stop]
permissions:
  motionrp.performance:
    description: ゴール・ホームランパフォーマンスのコマンド再生
    default: true
  motionrp.use:
    description: モーションの登録・再生
    default: true
  motionrp.admin:
    description: アイテム配布・設定の再読み込み
    default: op
