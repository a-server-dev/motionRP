plugins { id 'java' }

group = 'dev.aserver.motionrp'
version = '0.81.0'

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'
    compileOnly 'io.github.toxicity188:bettermodel-bukkit-api:3.6.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    compileOnly 'com.google.code.gson:gson:2.13.2'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.register('compileStudioProjects', Exec) {
    inputs.dir('projects'); inputs.file('tools/compile_studio_projects.py')
    inputs.file('src/main/resources/bettermodel/players/motionrp_rasengan.bbmodel')
    outputs.dir(layout.buildDirectory.dir('generated/studio'))
    commandLine 'python3', 'tools/compile_studio_projects.py', '--output', layout.buildDirectory.dir('generated/studio').get().asFile.absolutePath
}
tasks.processResources {
    dependsOn tasks.compileStudioProjects
    from(layout.buildDirectory.dir('generated/studio'))
    inputs.property('version', project.version)
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.register('distributionZip', Zip) {
    dependsOn tasks.jar
    archiveFileName = "${rootProject.name}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.jar) { rename { 'MotionRP.jar' } }
    from('README.md')
    from('src/main/resources/config.yml') { into 'example-config' }
    from('src/main/resources/bettermodel') { into 'bbmodels' }
    from('src/main/resources/skins') { into 'skins' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('sourceBundle', Zip) {
    archiveFileName = "${rootProject.name}-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        include 'src/**', 'tools/**', 'docs/**', 'gradle/**', '.github/**', 'editor/**', 'projects/**'
        exclude 'editor/node_modules/**', 'editor/dist/**', 'editor/test-results/**', 'editor/public/community/**', 'editor/public/library.json'
        include 'integration/*.mjs', 'integration/package*.json', 'integration/probe/**', 'integration/probe-plugin.yml'
        include 'README.md', '.gitignore', '.gitattributes', 'build.gradle', 'settings.gradle', 'gradlew', 'gradlew.bat'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Explicit test fixture target; this source set is excluded from the production JAR.
sourceSets {
    cancellationProbe {
        java.srcDir 'integration/probe'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('cancellationProbeJar', Jar) {
    dependsOn tasks.named('cancellationProbeClasses')
    from sourceSets.cancellationProbe.output
    from('integration/probe-plugin.yml') { rename { 'plugin.yml' } }
    archiveFileName = 'cancellation-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('integration-probe')
}
