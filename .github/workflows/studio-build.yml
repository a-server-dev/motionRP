name: Studio Build
on:
  pull_request:
    paths: ['projects/**', 'tools/compile_studio_projects.py', 'tools/build_studio_pack.py', 'src/main/java/dev/aserver/motionrp/Studio*', '.github/workflows/studio-build.yml']
  push:
    branches: [main]
    paths: ['projects/**', 'tools/compile_studio_projects.py', 'tools/build_studio_pack.py', 'src/main/java/dev/aserver/motionrp/Studio*', '.github/workflows/studio-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Validate creator projects
        run: python3 tools/compile_studio_projects.py --check
      - name: Build plugin
        run: ./gradlew --no-daemon --max-workers=2 clean build distributionZip sourceBundle
      - name: Generate BetterModel resource pack
        run: python3 tools/build_studio_pack.py --jar "$(find build/libs -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Studio-JAR-and-resource-pack-${{ github.sha }}
          path: build/studio-artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: Studio-build-diagnostics-${{ github.sha }}
          path: build/studio-artifacts/pack-build.log
          if-no-files-found: ignore
